[project]
name = "dash-mcp-server"
version = "1.1.1"
description = "MCP server for Dash, the macOS documentation browser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.13.1",
    "pydantic>=2.11.7",
    "httpx>=0.28.1",
    "html2text>=2024.2.26",
    "beautifulsoup4>=4.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dash_mcp_server"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.4",
]

[project.scripts]
dash-mcp-server = "dash_mcp_server:main"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "PIE", # flake8-pie
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.format]
docstring-code-format = true
